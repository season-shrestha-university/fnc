schema: spec-driven

# Project context
context: |
  - Product Vision: Mobile-first web application for community center volunteers to manage members, events, and fast attendance check-in via QR code scanning.
  - Target Audience & UX: Used primarily on smartphones at the door by volunteers with varying digital literacy. Prioritize large touch targets, high contrast, responsive layouts, and streamlined flows.
  - Stack Baseline: Next.js (App Router), React 19, TypeScript, Tailwind CSS, and shadcn/ui with Light theme as default.
  - Backend & Auth: Supabase (Auth with server-side cookies, PostgreSQL database, and Supabase Storage for photos).
  - Offline & Performance: Prioritize offline resilience for event check-ins (client-side outbox queue and local caching) and client-side photo optimization (WebP compression with JPEG fallback).

